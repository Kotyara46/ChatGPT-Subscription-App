name: Build upstream Phone Use Android APK
on:
  push:
    branches: [phone-use-android-build]
    paths:
      - '.github/workflows/build-phone-use-apk.yml'
  workflow_dispatch:
jobs:
  phone-use-foss-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      RUST_BACKTRACE: '1'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2'
    steps:
      - name: Checkout original Phone Use at reviewed revision
        uses: actions/checkout@v4
        with:
          repository: anotb/phone-use
          ref: 3d145a61b319620d931fd0f66ec1f16b3c416e9b
          path: phone-use
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-linux-android
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 | grep -E 'platforms;android-37|build-tools;37.0.0|ndk;27.2.12479018' | head -25 || true
          "$SDKMANAGER" --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Verify source inventory and pins
        run: |
          python3 phone-use/android/scripts/validate-research-export.py
          git -C phone-use rev-parse HEAD
      - name: Fetch pinned upstream native source
        working-directory: phone-use/android
        run: |
          set -euxo pipefail
          git clone --quiet https://github.com/cloudflare/cloudflared.git vendor/cloudflared
          git -C vendor/cloudflared checkout --quiet --detach 66587173e2cd5b2ea6d495e97aec6551e5e18c30
          git clone --quiet https://github.com/danielealbano/ngrok-java.git vendor/ngrok-java
          git -C vendor/ngrok-java checkout --quiet --detach f7f662ae3c9fddda282118a287bb94ad877d61e6
      - name: Build required ngrok Java jars
        working-directory: phone-use/android/vendor/ngrok-java
        run: |
          set -euxo pipefail
          export JAVA_11_HOME="$JAVA_HOME" JAVA_17_HOME="$JAVA_HOME"
          mvn -q -DskipTests compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml
          mvn -q -DskipTests package -pl ngrok-java --global-toolchains toolchains.xml
          cd ngrok-java-native/target/classes
          jar cf ../ngrok-java-native-classes.jar com/
      - name: Cross-compile ARM64 ngrok native component
        working-directory: phone-use/android/vendor/ngrok-java/ngrok-java-native
        run: |
          set -euxo pipefail
          export CC_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export AR_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --locked --release --target aarch64-linux-android
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libngrok_java.so ../../app/src/main/jniLibs/arm64-v8a/
      - name: Cross-compile ARM64 Cloudflare tunnel binary
        working-directory: phone-use/android/vendor/cloudflared
        run: |
          set -euxo pipefail
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" \
            go build -p 2 -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../../app/src/main/jniLibs/arm64-v8a/libcloudflared.so ./cmd/cloudflared
      - name: Assemble FOSS debug APK (ARM64)
        working-directory: phone-use/android
        run: |
          set -euxo pipefail
          sh ./gradlew --no-daemon --max-workers=2 \
            -PVERSION_NAME=0.0.0-phone-use-src+3d145a61 \
            -PVERSION_CODE=20000018 \
            :app:assembleFossDebug
      - name: Validate Android binary and save output
        working-directory: phone-use/android
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/foss/debug/app-foss-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" | head -15
          sha256sum "$APK" | tee phone-use-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phone-use-android-arm64-debug-apk
          path: |
            phone-use/android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
            phone-use/android/phone-use-sha256.txt
          if-no-files-found: error
