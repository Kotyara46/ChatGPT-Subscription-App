services:
  - type: web
    name: xiaomi-phone-bridge
    runtime: python
    branch: xiaomi-phone-bridge-build
    plan: free
    rootDir: xiaomi-phone-bridge/remote
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PHONE_BRIDGE_DEVICE_TOKEN
        sync: false
      - key: PHONE_BRIDGE_MCP_TOKEN
        sync: false
