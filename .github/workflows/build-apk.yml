name: Build CS16 OneTap Installer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test public Drive source
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          folders = {
              "valve": "13ES7ete84kf1bqZEV36QUHUxWbpUPfyU",
              "cstrike": "1q0sK9tdBaXM2XiqOD1t7jdec3OuuSzE2",
          }
          for name, fid in folders.items():
              req = urllib.request.Request(f"https://drive.google.com/embeddedfolderview?id={fid}", headers=ua)
              with urllib.request.urlopen(req, timeout=30) as r:
                  html = r.read().decode("utf-8", "replace")
              links = re.findall(r'https://drive\\.google\\.com/(?:file/d/|drive/folders/)', html)
              if not links:
                  raise SystemExit(f"Drive folder {name} is not publicly readable")
              print(name, "OK", len(links), "visible links")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CS16-OneTap-Installer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16-OneTap-Installer-APK
          path: CS16-OneTap-Installer.apk
          if-no-files-found: error
          retention-days: 30
