name: Build CS16 KoT46 Player 3 Files v13

on:
  push:
    branches: [ "cs16-player-3files-v13" ]
    paths:
      - ".github/workflows/build-cs16-native-ru-v7.yml"
      - ".github/scripts/patch_cs16_native_v5.py"
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download last working player pack
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1n_u8dntJKzeJDDcgF05sZsbgyBBqL6hb&export=download&confirm=t'             -o /tmp/v12.zip
          test "$(stat -c%s /tmp/v12.zip)" -gt 90000000
          unzip -t /tmp/v12.zip >/dev/null
          mkdir -p /tmp/v12
          unzip -q /tmp/v12.zip -d /tmp/v12
          test -f /tmp/v12/CS16-Installer-Native-RU.apk
          test -f /tmp/v12/CS16Client-Native-RU.apk
          test -f /tmp/v12/Xash3D-FWGS-Engine.apk

      - name: Reuse verified game manifest and KoT46 touch/background assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets/cs16extras app/src/main/assets/russian_ui
          unzip -p /tmp/v12/CS16-Installer-Native-RU.apk assets/drive-manifest.tsv > app/src/main/assets/drive-manifest.tsv
          rm -rf /tmp/oldassets
          mkdir -p /tmp/oldassets
          cd /tmp/oldassets
          unzip -q /tmp/v12/CS16-Installer-Native-RU.apk 'assets/cs16extras/*'
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/oldassets/assets/cs16extras/. app/src/main/assets/cs16extras/
          test "$(wc -l < app/src/main/assets/drive-manifest.tsv)" -gt 4500
          test -f app/src/main/assets/cs16extras/touch/gfx/voicechat.png
          grep -F '+voicerecord' app/src/main/assets/cs16extras/touch.cfg
          test "$(find app/src/main/assets/cs16extras/resource/background -name '*.tga' | wc -l)" -eq 12

      - name: Embed verified Russian menu files
        shell: bash
        run: |
          set -euxo pipefail
          D=app/src/main/assets/russian_ui
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1mgwUlaukE9K8X8N2Gl44X14APjDKUg-L&export=download&confirm=t' -o "$D/GameMenu.res"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1VLlW_lUw6fHHVQ29bXsNgt6L2vo_hCH2&export=download&confirm=t' -o "$D/gameui_russian.txt"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1kJcgBuMKbGBODobEZjREWx2vt8WjyRDj&export=download&confirm=t' -o "$D/serverbrowser_russian.txt"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1QyCKJ7l8lxCSZXjT7VNSIP6Nh9ftB2KM&export=download&confirm=t' -o "$D/vgui_russian.txt"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1ws8bwyelvwB7y2yM3N70vMDmWFKMSuEr&export=download&confirm=t' -o "$D/valve_russian.txt"
          iconv -f UTF-16LE -t UTF-8 "$D/gameui_russian.txt" | grep -F '"GameUI_GameMenu_FindServers"'
          iconv -f UTF-16LE -t UTF-8 "$D/serverbrowser_russian.txt" | grep -F '"ServerBrowser_FavoritesTab"'

      - name: Patch and build v13 installer
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile .github/scripts/patch_cs16_native_v5.py
          python3 .github/scripts/patch_cs16_native_v5.py installer
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CS16-Installer-Native-RU.apk

      - name: Reuse working engine and client
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/v12/CS16Client-Native-RU.apk .
          cp /tmp/v12/Xash3D-FWGS-Engine.apk .

      - name: Validate v13
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t CS16-Installer-Native-RU.apk >/dev/null
          unzip -t CS16Client-Native-RU.apk >/dev/null
          unzip -t Xash3D-FWGS-Engine.apk >/dev/null
          unzip -l CS16-Installer-Native-RU.apk | grep -F 'assets/russian_ui/GameMenu.res'
          unzip -l CS16-Installer-Native-RU.apk | grep -F 'assets/russian_ui/gameui_russian.txt'
          unzip -l CS16-Installer-Native-RU.apk | grep -F 'assets/russian_ui/serverbrowser_russian.txt'
          unzip -l CS16-Installer-Native-RU.apk | grep -F 'assets/cs16extras/touch/gfx/voicechat.png'
          unzip -l CS16-Installer-Native-RU.apk | grep -F 'assets/cs16extras/resource/background/800_3_d_loading.tga'
          grep -F 'KoT46_ Player' app/src/main/java/com/kotyara/chatgptpluscontrol/MainActivity.java
          grep -F 'voice_enable 1' app/src/main/java/com/kotyara/chatgptpluscontrol/MainActivity.java
          grep -F '1zNEmEf6kgGxZKRER-mlrnsVODvIx7QX_' app/src/main/java/com/kotyara/chatgptpluscontrol/ServerSync.java
          grep -F 'ServerSync.schedule(this)' app/src/main/java/com/kotyara/chatgptpluscontrol/MainActivity.java
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree CS16-Installer-Native-RU.apk --file AndroidManifest.xml | grep -F 'ServerSyncJob'

      - name: Package exactly three player files
        shell: bash
        run: |
          set -euxo pipefail
          rm -f CS16-Android-KoT46-PLAYER-v13-3FILES.zip
          zip -9 CS16-Android-KoT46-PLAYER-v13-3FILES.zip             Xash3D-FWGS-Engine.apk             CS16Client-Native-RU.apk             CS16-Installer-Native-RU.apk
          test "$(unzip -Z1 CS16-Android-KoT46-PLAYER-v13-3FILES.zip | wc -l)" -eq 3
          unzip -Z1 CS16-Android-KoT46-PLAYER-v13-3FILES.zip
          sha256sum CS16-Android-KoT46-PLAYER-v13-3FILES.zip             Xash3D-FWGS-Engine.apk CS16Client-Native-RU.apk CS16-Installer-Native-RU.apk

      - name: Upload final 3-file player pack
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Android-KoT46-PLAYER-v13-3FILES
          path: CS16-Android-KoT46-PLAYER-v13-3FILES.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
