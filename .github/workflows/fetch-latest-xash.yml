name: Fetch latest Xash3D Android

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/fetch-latest-xash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download latest official Xash3D FWGS Android APK
        run: |
          curl -L --fail --retry 3 \
            -o Xash3D-FWGS-latest.apk \
            https://github.com/FWGS/xash3d-fwgs/releases/download/continuous/xash3d-fwgs-android.apk
          sha256sum Xash3D-FWGS-latest.apk | tee Xash3D-FWGS-latest.sha256
          test "$(stat -c%s Xash3D-FWGS-latest.apk)" -gt 40000000

      - name: Upload official APK
        uses: actions/upload-artifact@v4
        with:
          name: Xash3D-FWGS-latest-Android
          path: |
            Xash3D-FWGS-latest.apk
            Xash3D-FWGS-latest.sha256
          if-no-files-found: error
          retention-days: 30
