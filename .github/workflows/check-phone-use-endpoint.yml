name: Check Phone Use MCP endpoint (read-only)
on:
  push:
    branches: [phone-use-android-build]
    paths: ['.github/workflows/check-phone-use-endpoint.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check public DNS, transport, and OAuth discovery without credentials
        env:
          HOST: associated-eur-downtown-drive.trycloudflare.com
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import socket, urllib.request, urllib.error, os, json
          host=os.environ["HOST"]
          for control in ["example.com","www.cloudflare.com"]:
              try: print("CONTROL_DNS:",control,socket.getaddrinfo(control,443,type=socket.SOCK_STREAM)[0][4][0])
              except Exception as e: print("CONTROL_ERROR:",control,type(e).__name__,str(e)[:130])
          try:
              print("DNS:", socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)[0][4][0])
          except Exception as e:
              print("DNS_ERROR:", type(e).__name__, str(e)[:160])
          for path in ["/mcp", "/.well-known/oauth-authorization-server", "/.well-known/oauth-protected-resource"]:
              url="https://"+host+path
              req=urllib.request.Request(url,headers={"Accept":"application/json, text/event-stream","User-Agent":"PhoneUse-Connection-Diagnostic/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      print("PATH",path,"STATUS",r.status,"CONTENT_TYPE",r.headers.get("Content-Type"))
              except urllib.error.HTTPError as e:
                  print("PATH",path,"STATUS",e.code,"CONTENT_TYPE",e.headers.get("Content-Type"),"WWW_AUTHENTICATE",bool(e.headers.get("WWW-Authenticate")))
              except Exception as e:
                  print("PATH",path,"ERROR",type(e).__name__,str(e)[:180])
          PY
