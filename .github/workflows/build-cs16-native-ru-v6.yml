name: Build KoT46 CS16 Final v12

on:
  push:
    branches: [ "cs16-final-v12" ]
    paths:
      - "server-admin/**"
      - "server-sync/**"
      - ".github/workflows/build-cs16-native-ru-v6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Embed verified Russian CS 1.6 UI
        shell: bash
        run: |
          set -euxo pipefail
          D=server-sync/app/src/main/assets/russian_ui
          mkdir -p "$D"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1mgwUlaukE9K8X8N2Gl44X14APjDKUg-L&export=download&confirm=t' -o "$D/GameMenu.res"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1VLlW_lUw6fHHVQ29bXsNgt6L2vo_hCH2&export=download&confirm=t' -o "$D/gameui_russian.txt"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1kJcgBuMKbGBODobEZjREWx2vt8WjyRDj&export=download&confirm=t' -o "$D/serverbrowser_russian.txt"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1QyCKJ7l8lxCSZXjT7VNSIP6Nh9ftB2KM&export=download&confirm=t' -o "$D/vgui_russian.txt"
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1ws8bwyelvwB7y2yM3N70vMDmWFKMSuEr&export=download&confirm=t' -o "$D/valve_russian.txt"
          test "$(stat -c%s "$D/GameMenu.res")" -gt 500
          test "$(stat -c%s "$D/gameui_russian.txt")" -gt 40000
          test "$(stat -c%s "$D/serverbrowser_russian.txt")" -gt 30000
          test "$(stat -c%s "$D/vgui_russian.txt")" -gt 10000
          test "$(stat -c%s "$D/valve_russian.txt")" -gt 20000
          sha256sum "$D"/*

      - name: Build admin APK
        shell: bash
        run: |
          set -euxo pipefail
          cd server-admin
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/KoT46-CS16-Server-Admin-v12.apk"

      - name: Build player sync APK
        shell: bash
        run: |
          set -euxo pipefail
          cd server-sync
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/KoT46-CS16-Server-Sync-v12.apk"

      - name: Validate APK contents
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t KoT46-CS16-Server-Admin-v12.apk >/dev/null
          unzip -t KoT46-CS16-Server-Sync-v12.apk >/dev/null
          for f in GameMenu.res gameui_russian.txt serverbrowser_russian.txt vgui_russian.txt valve_russian.txt; do
            unzip -l KoT46-CS16-Server-Sync-v12.apk | grep -F "assets/russian_ui/$f"
          done
          unzip -p KoT46-CS16-Server-Sync-v12.apk assets/russian_ui/gameui_russian.txt > /tmp/gameui
          unzip -p KoT46-CS16-Server-Sync-v12.apk assets/russian_ui/serverbrowser_russian.txt > /tmp/serverbrowser
          test "$(stat -c%s /tmp/gameui)" -gt 40000
          test "$(stat -c%s /tmp/serverbrowser)" -gt 30000

      - name: Prepare final player pack
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf player_v12
          mkdir -p player_v12
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1kShy1KB0lGr_xNqDgi-cNGoPkY5Z-cAK&export=download&confirm=t'             -o /tmp/v11.zip
          test "$(stat -c%s /tmp/v11.zip)" -gt 90000000
          unzip -q /tmp/v11.zip -d player_v12
          rm -f player_v12/KoT46-CS16-Server-Sync.apk player_v12/УСТАНОВКА_v11.txt player_v12/SHA256SUMS.txt
          cp KoT46-CS16-Server-Sync-v12.apk player_v12/
          rm -rf player_v12/РУССКОЕ_МЕНЮ_BACKUP
          mkdir -p player_v12/РУССКОЕ_МЕНЮ_BACKUP
          cp server-sync/app/src/main/assets/russian_ui/* player_v12/РУССКОЕ_МЕНЮ_BACKUP/
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0 Android'             'https://drive.usercontent.google.com/download?id=1zNEmEf6kgGxZKRER-mlrnsVODvIx7QX_&export=download&confirm=t'             -o player_v12/ЦЕНТРАЛЬНЫЕ_СЕРВЕРЫ_ПРИМЕР.txt
          cat > player_v12/УСТАНОВКА_v12.txt <<'EOF'
          COUNTER-STRIKE 1.6 ANDROID — KoT46 FINAL v12

          1. Установи Xash3D-FWGS-Engine.apk.
          2. Установи CS16Client-Native-RU.apk.
          3. Установи CS16-Installer-Native-RU.apk.
          4. В Installer разреши доступ к файлам и нажми «Установить / восстановить игру».
          5. Дождись «ГОТОВО».
          6. Установи KoT46-CS16-Server-Sync-v12.apk.
          7. В Sync v12 один раз выбери: Внутренняя память / xash.
          8. Нажми «СИНХРОНИЗИРОВАТЬ СЕЙЧАС».
          9. Для игры используй «ОБНОВИТЬ И ЗАПУСТИТЬ CS 1.6».

          В v12:
          - ник KoT46_ Player;
          - фон KoT46 DESIGN;
          - микрофон / +voicerecord;
          - кнопка E / +use и консоль;
          - штатное русское меню и русский браузер серверов;
          - центральное Избранное от администратора;
          - фоновая проверка примерно каждые 15 минут;
          - Sync v12 при каждой проверке восстанавливает GameMenu.res,
            gameui_russian.txt, serverbrowser_russian.txt, vgui_russian.txt и valve_russian.txt.
          EOF
          cat > player_v12/ПРОВЕРКА_РУССКОГО_МЕНЮ.txt <<'EOF'
          Главное меню:
          Возобновить игру
          Отключиться
          Список игроков
          Новая игра
          Найти серверы
          Настройки
          Выход

          Серверы:
          Интернет
          Избранное
          История
          Зритель
          Локальная сеть
          Друзья
          Фильтры
          Добавить данный сервер
          Добавить
          Обновить
          Подкл.

          Колонки:
          Игроки / Серверы / Игра / Карта / Пинг
          EOF
          (
            cd player_v12
            sha256sum Xash3D-FWGS-Engine.apk CS16Client-Native-RU.apk CS16-Installer-Native-RU.apk               KoT46-CS16-Server-Sync-v12.apk KoT46-Design-background.jpg РУССКОЕ_МЕНЮ_BACKUP/* > SHA256SUMS.txt
          )
          unzip -t player_v12/CS16-Installer-Native-RU.apk >/dev/null
          unzip -t player_v12/CS16Client-Native-RU.apk >/dev/null
          unzip -t player_v12/Xash3D-FWGS-Engine.apk >/dev/null
          unzip -t player_v12/KoT46-CS16-Server-Sync-v12.apk >/dev/null
          ls -lh player_v12

      - name: Prepare admin pack
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf admin_v12
          mkdir -p admin_v12
          cp KoT46-CS16-Server-Admin-v12.apk admin_v12/
          cp player_v12/ЦЕНТРАЛЬНЫЕ_СЕРВЕРЫ_ПРИМЕР.txt admin_v12/KoT46-servers.txt
          cat > admin_v12/АДМИН_ИНСТРУКЦИЯ_v12.txt <<'EOF'
          KoT46 — управление общим Избранным CS 1.6

          1. Установи KoT46-CS16-Server-Admin-v12.apk только себе.
          2. Первый раз выбери на Google Диске существующий файл KoT46-servers.txt
             из папки Half-Life.
          3. Формат строк: IP:PORT | название сервера
          4. Нажми «СОХРАНИТЬ ДЛЯ ВСЕХ ИГРОКОВ».
          5. Игроки получат изменения автоматически или сразу через
             «СИНХРОНИЗИРОВАТЬ СЕЙЧАС» / «ОБНОВИТЬ И ЗАПУСТИТЬ CS 1.6».

          ВАЖНО: не удаляй KoT46-servers.txt и не создавай вместо него новый файл:
          Sync v12 привязан к ID текущего центрального файла.
          EOF
          (cd admin_v12 && sha256sum KoT46-CS16-Server-Admin-v12.apk KoT46-servers.txt > SHA256SUMS.txt)

      - name: Upload final player pack
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Android-Native-RU-v12-KoT46-FINAL-CENTRAL-SYNC
          path: player_v12/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload admin pack
        uses: actions/upload-artifact@v4
        with:
          name: KoT46-CS16-ADMIN-v12
          path: admin_v12/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload v12 APKs
        uses: actions/upload-artifact@v4
        with:
          name: KoT46-CS16-v12-APKs
          path: |
            KoT46-CS16-Server-Admin-v12.apk
            KoT46-CS16-Server-Sync-v12.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
