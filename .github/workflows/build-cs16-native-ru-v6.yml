name: Build KoT46 CS16 Server Manager

on:
  push:
    branches: [ "cs16-server-manager-v1" ]
    paths:
      - "server-manager/**"
      - ".github/workflows/build-cs16-native-ru-v6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build server manager
        shell: bash
        run: |
          set -euxo pipefail
          cd server-manager
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/KoT46-CS16-Server-Manager.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum KoT46-CS16-Server-Manager.apk > KoT46-CS16-Server-Manager.sha256
          unzip -t KoT46-CS16-Server-Manager.apk >/dev/null

      - name: Upload server manager
        uses: actions/upload-artifact@v4
        with:
          name: KoT46-CS16-Server-Manager
          path: |
            KoT46-CS16-Server-Manager.apk
            KoT46-CS16-Server-Manager.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
