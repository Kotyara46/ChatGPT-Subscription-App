name: Build Xiaomi Phone Bridge APK
on:
  push:
    branches: [xiaomi-phone-bridge-build]
    paths:
      - 'xiaomi-phone-bridge/android/**'
      - '.github/workflows/xiaomi-phone-bridge-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble APK
        run: gradle -p xiaomi-phone-bridge/android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-phone-bridge-apk
          path: xiaomi-phone-bridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
