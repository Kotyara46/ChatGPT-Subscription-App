name: Build CS16 Android Final RU

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-cs16-final-fast.yml"
      - "app/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache zip
          python3 -m pip install --disable-pip-version-check 'git+https://github.com/wkentaro/gdown.git@main'

      - name: Build Google Drive game manifest
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import gdown

          sources = {
              'valve': '1BBpdGENsUE9f90MZ7z6Qa3trxxllS-a0',
              'cstrike': '1x32CLdPe-y-YWzTHoiOPwaPp3SzKh2KM',
          }
          rows = []
          for root, folder_id in sources.items():
              print('Listing', root, flush=True)
              items = gdown.download_folder(
                  id=folder_id,
                  output=f'manifest-work/{root}',
                  quiet=True,
                  use_cookies=False,
                  skip_download=True,
                  timeout=60,
              )
              if not items:
                  raise SystemExit(f'No files listed for {root}')
              for item in items:
                  rel = item.path.replace('\\\\', '/').replace('\\', '/')
                  while rel.startswith('/'):
                      rel = rel[1:]
                  rows.append((item.id, f'{root}/{rel}'))
              print(root, len(items), 'files', flush=True)

          rows.extend([
              ('1VLlW_lUw6fHHVQ29bXsNgt6L2vo_hCH2', 'cstrike/resource/gameui_russian.txt'),
              ('1kJcgBuMKbGBODobEZjREWx2vt8WjyRDj', 'cstrike/resource/serverbrowser_russian.txt'),
              ('1QyCKJ7l8lxCSZXjT7VNSIP6Nh9ftB2KM', 'cstrike/resource/vgui_russian.txt'),
              ('1ws8bwyelvwB7y2yM3N70vMDmWFKMSuEr', 'valve/resource/valve_russian.txt'),
          ])

          by_path = {path: fid for fid, path in rows}
          rows = [(fid, path) for path, fid in by_path.items()]
          rows.sort(key=lambda x: x[1].lower())

          required = {
              'cstrike/liblist.gam',
              'cstrike/sprites/hud.txt',
              'cstrike/resource/gameui_russian.txt',
              'cstrike/resource/serverbrowser_russian.txt',
              'cstrike/resource/vgui_russian.txt',
              'valve/resource/valve_russian.txt',
          }
          paths = {p for _, p in rows}
          missing = sorted(required - paths)
          if missing:
              raise SystemExit('Missing critical files: ' + ', '.join(missing))
          if len(rows) < 4000:
              raise SystemExit(f'Manifest unexpectedly small: {len(rows)} files')

          tab = chr(9)
          with open('app/src/main/assets/drive-manifest.tsv', 'w', encoding='utf-8', newline='\n') as f:
              f.write('# id' + tab + 'path\n')
              for fid, path in rows:
                  f.write(fid + tab + path + '\n')
          print('Manifest files:', len(rows))
          PY
          wc -l app/src/main/assets/drive-manifest.tsv
          grep -F $'\tcstrike/liblist.gam' app/src/main/assets/drive-manifest.tsv
          grep -F $'\tcstrike/sprites/hud.txt' app/src/main/assets/drive-manifest.tsv
          grep -F $'\tcstrike/resource/gameui_russian.txt' app/src/main/assets/drive-manifest.tsv

      - name: Verify direct Google Drive download
        shell: bash
        run: |
          FILE_ID="$(awk -F '\t' '$2=="cstrike/liblist.gam" {print $1}' app/src/main/assets/drive-manifest.tsv)"
          test -n "$FILE_ID"
          curl -L --fail --retry 4 --retry-all-errors \
            -A 'Mozilla/5.0 (Android) CS16-Mobile/3.0' \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o /tmp/liblist.gam
          test "$(stat -c%s /tmp/liblist.gam)" -gt 50
          if grep -Eqi '<!doctype html|<html' /tmp/liblist.gam; then
            echo 'Google Drive returned HTML instead of liblist.gam' >&2
            exit 1
          fi
          head -c 200 /tmp/liblist.gam | strings

      - name: Build final Russian launcher
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CS16-Final-RU.apk

      - name: Clone CS16Client
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Velaron/cs16-client.git cs16

      - name: Patch CS16Client for Russian UI and GoldSrc 48
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cs16/android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = s.replace('applicationId = "su.xash.cs16client"', 'applicationId = "com.kotyara.cs16client"')
          p.write_text(s, encoding='utf-8')
          PY
          cat > cs16/android/app/src/main/java/su/xash/cs16client/MainActivity.java <<'JAVA'
          package su.xash.cs16client;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  String engine = "su.xash.engine.test";
                  try {
                      getPackageManager().getPackageInfo(engine, 0);
                  } catch (PackageManager.NameNotFoundException e) {
                      engine = "su.xash.engine";
                      try {
                          getPackageManager().getPackageInfo(engine, 0);
                      } catch (PackageManager.NameNotFoundException ex) {
                          startActivity(new Intent(Intent.ACTION_VIEW,
                                  Uri.parse("https://github.com/FWGS/xash3d-fwgs/releases/tag/continuous")));
                          finish();
                          return;
                      }
                  }

                  String argv = "-language russian -dll @yapb +cl_advertise_engine_in_name 0 +cl_ticket_generator revemu2013";
                  String server = getIntent().getStringExtra("server");
                  if (server != null && server.matches("^[A-Za-z0-9._-]+:[0-9]{1,5}$")) {
                      argv += " +connect " + server + " gs";
                  }

                  Intent game = new Intent().setComponent(
                          new ComponentName(engine, "su.xash.engine.XashActivity"))
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK)
                          .putExtra("gamedir", "cstrike")
                          .putExtra("gamelibdir", getApplicationInfo().nativeLibraryDir)
                          .putExtra("argv", argv)
                          .putExtra("package", getPackageName());
                  startActivity(game);
                  finish();
              }
          }
          JAVA

      - name: Build patched CS16Client
        working-directory: cs16/android
        run: |
          chmod +x gradlew
          ./gradlew assembleGitDebug --stacktrace
          cp app/build/outputs/apk/git/debug/app-git-debug.apk "$GITHUB_WORKSPACE/CS16Client-Final-RU.apk"

      - name: Download latest Xash3D FWGS Android
        run: |
          curl -L --fail --retry 4 --retry-all-errors \
            -o Xash3D-FWGS-latest.apk \
            https://github.com/FWGS/xash3d-fwgs/releases/download/continuous/xash3d-fwgs-android.apk
          test "$(stat -c%s Xash3D-FWGS-latest.apk)" -gt 30000000

      - name: Validate APK files
        shell: bash
        run: |
          unzip -t CS16-Final-RU.apk >/dev/null
          unzip -t CS16Client-Final-RU.apk >/dev/null
          unzip -t Xash3D-FWGS-latest.apk >/dev/null
          unzip -l CS16-Final-RU.apk | grep -F 'assets/drive-manifest.tsv'
          test "$(stat -c%s CS16-Final-RU.apk)" -gt 1000000
          test "$(stat -c%s CS16Client-Final-RU.apk)" -gt 10000000

      - name: Create final package and hashes
        shell: bash
        run: |
          cat > УСТАНОВКА.txt <<'EOF'
          COUNTER-STRIKE 1.6 ANDROID — ФИНАЛЬНАЯ РУССКАЯ СБОРКА

          Установка:
          1. Установи Xash3D-FWGS-latest.apk.
          2. Установи CS16Client-Final-RU.apk.
          3. Установи CS16-Final-RU.apk и запускай именно «Counter-Strike 1.6».
          4. Нажми «Установить / восстановить игру» и разреши приложению доступ ко всем файлам.
          5. Лаунчер сам скачает valve + cstrike из твоей Google Drive-папки в /storage/emulated/0/xash.
             Если интернет/Google Drive прервёт загрузку, нажми «Продолжить установку» — уже готовые файлы сохраняются.

          Что изменено:
          - интерфейс лаунчера полностью на русском;
          - меню оформлено в стиле классической PC CS 1.6;
          - добавлены русские GameUI/VGUI/Valve/ServerBrowser resource-файлы из твоего Drive;
          - русский язык принудительно передаётся игровому клиенту;
          - удалены отладочные параметры -dev 2 и -log;
          - браузер серверов запрашивает Valve Master Server с gamedir=cstrike;
          - поддержан A2S_INFO для новых и старых GoldSrc-ответов;
          - можно подключаться по IP:порт;
          - подключение запускается с явным GoldSrc protocol 48 (connect ... gs);
          - установщик проверяет HUD number_0 и русские resource-файлы.

          Некоторые серверы с обязательной Steam-аутентификацией или собственными античит-модулями
          могут не принимать Xash3D-клиенты. Это ограничение совместимости конкретного сервера.
          EOF
          sha256sum CS16-Final-RU.apk CS16Client-Final-RU.apk Xash3D-FWGS-latest.apk > SHA256SUMS.txt
          zip -9 CS16-Android-Final-RU.zip \
            CS16-Final-RU.apk CS16Client-Final-RU.apk Xash3D-FWGS-latest.apk \
            УСТАНОВКА.txt SHA256SUMS.txt
          ls -lh CS16-Final-RU.apk CS16Client-Final-RU.apk Xash3D-FWGS-latest.apk CS16-Android-Final-RU.zip
          cat SHA256SUMS.txt

      - name: Upload final Android pack
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Android-Final-RU
          path: |
            CS16-Android-Final-RU.zip
            CS16-Final-RU.apk
            CS16Client-Final-RU.apk
            Xash3D-FWGS-latest.apk
            УСТАНОВКА.txt
            SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
