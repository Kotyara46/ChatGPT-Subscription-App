name: Build CS16 Native RU v5

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-cs16-native-ru.yml"
      - ".github/scripts/patch_cs16_native_v3.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout installer
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ccache zip
          python3 -m pip install --disable-pip-version-check 'git+https://github.com/wkentaro/gdown.git@main'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build complete Google Drive manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import gdown
          from pathlib import Path

          sources = {
              'valve': '1BBpdGENsUE9f90MZ7z6Qa3trxxllS-a0',
              'cstrike': '1x32CLdPe-y-YWzTHoiOPwaPp3SzKh2KM',
          }
          rows = []
          for root, folder_id in sources.items():
              print('Listing', root, flush=True)
              items = gdown.download_folder(
                  id=folder_id,
                  output=f'manifest-work/{root}',
                  quiet=True,
                  use_cookies=False,
                  skip_download=True,
                  timeout=60,
              )
              if not items:
                  raise SystemExit(f'No files listed for {root}')
              for item in items:
                  rel = item.path.replace('\\', '/').lstrip('/')
                  rows.append((item.id, f'{root}/{rel}'))
              print(root, len(items), 'files', flush=True)

          # These resources live outside the shared cstrike folder on Drive,
          # but mainui requires them inside cstrike/resource at runtime.
          rows.extend([
              ('1VLlW_lUw6fHHVQ29bXsNgt6L2vo_hCH2', 'cstrike/resource/gameui_russian.txt'),
              ('1kJcgBuMKbGBODobEZjREWx2vt8WjyRDj', 'cstrike/resource/serverbrowser_russian.txt'),
              ('1QyCKJ7l8lxCSZXjT7VNSIP6Nh9ftB2KM', 'cstrike/resource/vgui_russian.txt'),
              ('1ws8bwyelvwB7y2yM3N70vMDmWFKMSuEr', 'valve/resource/valve_russian.txt'),
              ('1XOeUW_oH1qX5vn_41t-CIGIB5-VK8yr7', 'cstrike/resource/BackgroundLayout.txt'),
              ('103_imRj1mBmQVKli2NPItICVl_GwWt0D', 'cstrike/resource/background/800_1_a_loading.tga'),
              ('1zE96s4UzSPbXs6O1uSCAmmuESTrlKgIA', 'cstrike/resource/background/800_1_b_loading.tga'),
              ('1yGdXJUVtNLxZnBczdJfHqbWSEkUwe2o6', 'cstrike/resource/background/800_1_c_loading.tga'),
              ('1DpmKUvdVkmAHr9PenELkOEwOkwy5NgGa', 'cstrike/resource/background/800_1_d_loading.tga'),
              ('1nE_msXRrTCVnbkstBdbLnjGfd_1_qm3a', 'cstrike/resource/background/800_2_a_loading.tga'),
              ('1vO89NHUM5pjPUgfEkm-aYFbuyrRQns7Q', 'cstrike/resource/background/800_2_b_loading.tga'),
              ('1gIXdNAI3BjQuGSy1C9J6wHQkdpVBfymR', 'cstrike/resource/background/800_2_c_loading.tga'),
              ('1nQLUAA5xv7MZJAkkIzz8_bNGjF3wiMtk', 'cstrike/resource/background/800_2_d_loading.tga'),
              ('1PMieqDLQBSATIiY98nHzWy_QMqn6BepS', 'cstrike/resource/background/800_3_a_loading.tga'),
              ('1ITf_T0rF58Fdy91xF6AOP8Vcs6buwJqz', 'cstrike/resource/background/800_3_b_loading.tga'),
              ('1sGXcGub04fFDmwCp1exJqJ5fXFGpTEV1', 'cstrike/resource/background/800_3_c_loading.tga'),
              ('13d1MA7DnrnoumyLxftH6_SCLFx1rZ9cp', 'cstrike/resource/background/800_3_d_loading.tga'),
          ])

          by_path = {path: fid for fid, path in rows}
          rows = sorted(((fid, path) for path, fid in by_path.items()), key=lambda x: x[1].lower())
          paths = {path for _, path in rows}

          required = {
              'cstrike/liblist.gam',
              'cstrike/sprites/hud.txt',
              'cstrike/resource/gameui_russian.txt',
              'cstrike/resource/serverbrowser_russian.txt',
              'cstrike/resource/vgui_russian.txt',
              'valve/resource/valve_russian.txt',
              'cstrike/resource/BackgroundLayout.txt',
              'cstrike/resource/background/800_1_a_loading.tga',
              'cstrike/resource/background/800_1_b_loading.tga',
              'cstrike/resource/background/800_1_c_loading.tga',
              'cstrike/resource/background/800_1_d_loading.tga',
              'cstrike/resource/background/800_2_a_loading.tga',
              'cstrike/resource/background/800_2_b_loading.tga',
              'cstrike/resource/background/800_2_c_loading.tga',
              'cstrike/resource/background/800_2_d_loading.tga',
              'cstrike/resource/background/800_3_a_loading.tga',
              'cstrike/resource/background/800_3_b_loading.tga',
              'cstrike/resource/background/800_3_c_loading.tga',
              'cstrike/resource/background/800_3_d_loading.tga',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit('Missing critical Drive files: ' + ', '.join(missing))
          if len(rows) < 4500:
              raise SystemExit(f'Manifest unexpectedly small: {len(rows)}')

          with Path('app/src/main/assets/drive-manifest.tsv').open('w', encoding='utf-8', newline='\n') as f:
              f.write('# id\tpath\n')
              for fid, path in rows:
                  f.write(fid + '\t' + path + '\n')
          print('Manifest files:', len(rows))
          PY
          wc -l app/src/main/assets/drive-manifest.tsv
          grep -F $'\tcstrike/resource/BackgroundLayout.txt' app/src/main/assets/drive-manifest.tsv
          grep -F $'\tcstrike/resource/background/800_3_d_loading.tga' app/src/main/assets/drive-manifest.tsv

      - name: Verify direct Drive file access
        shell: bash
        run: |
          set -euxo pipefail
          FILE_ID="$(awk -F '\t' '$2=="cstrike/liblist.gam" {print $1}' app/src/main/assets/drive-manifest.tsv)"
          test -n "$FILE_ID"
          curl -L --fail --retry 4 --retry-all-errors \
            -A 'Mozilla/5.0 (Android) CS16-Native-RU/4.0' \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o /tmp/liblist.gam
          grep -a -F 'Counter-Strike' /tmp/liblist.gam

      - name: Patch and build installer
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/patch_cs16_native_v3.py installer
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CS16-Installer-Native-RU.apk

      - name: Clone and patch CS16Client native UI
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Velaron/cs16-client.git cs16
          cd cs16
          git checkout e30e27c3bd890f731ad7921d9c876d171aea4b32
          git submodule update --init --recursive --depth 1
          cd ..
          python3 .github/scripts/patch_cs16_native_v3.py client

      - name: Build patched CS16Client
        working-directory: cs16/android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -a ../3rdparty/cs16client-extras/. app/src/main/assets/
          test -f app/src/main/assets/touch/gfx/attack.png
          test -f app/src/main/assets/touch/gfx/jump.png
          test -f app/src/main/assets/touch_presets/phone_ahsim.cfg
          ./gradlew assembleGitDebug --stacktrace
          cp app/build/outputs/apk/git/debug/app-git-debug.apk "$GITHUB_WORKSPACE/CS16Client-Native-RU.apk"

      - name: Download current Xash3D FWGS
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o Xash3D-FWGS-Native-RU.apk \
            https://github.com/FWGS/xash3d-fwgs/releases/download/continuous/xash3d-fwgs-android.apk
          test "$(stat -c%s Xash3D-FWGS-Native-RU.apk)" -gt 30000000

      - name: Validate APKs and patched native menu
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t CS16-Installer-Native-RU.apk >/dev/null
          unzip -t CS16Client-Native-RU.apk >/dev/null
          unzip -t Xash3D-FWGS-Native-RU.apk >/dev/null
          unzip -l CS16-Installer-Native-RU.apk | grep -F 'assets/drive-manifest.tsv'
          unzip -l CS16Client-Native-RU.apk | grep -F 'lib/arm64-v8a/libmenu_android_arm64.so'
          unzip -l CS16Client-Native-RU.apk | grep -F 'lib/arm64-v8a/libclient_android_arm64.so'
          unzip -l CS16Client-Native-RU.apk | grep -F 'lib/arm64-v8a/libyapb_android_arm64.so'
          unzip -p CS16Client-Native-RU.apk lib/arm64-v8a/libmenu_android_arm64.so > /tmp/libmenu.so
          unzip -l CS16Client-Native-RU.apk | grep -F 'assets/touch/gfx/attack.png'
          unzip -l CS16Client-Native-RU.apk | grep -F 'assets/touch/gfx/jump.png'
          unzip -l CS16Client-Native-RU.apk | grep -F 'assets/touch/gfx/reload.png'
          unzip -l CS16Client-Native-RU.apk | grep -F 'assets/touch_presets/phone_ahsim.cfg'
          strings /tmp/libmenu.so | grep -F 'GameUI_GameMenu_NewGame'
          strings /tmp/libmenu.so | grep -F 'GameUI_GameMenu_FindServers'

      - name: Package corrected build
        shell: bash
        run: |
          set -euxo pipefail
          cat > УСТАНОВКА.txt <<'EOF'
          COUNTER-STRIKE 1.6 ANDROID — NATIVE RU v5

          1. Удали старый CS16Client и старый установщик. Xash3D можно обновить поверх.
          2. Установи Xash3D-FWGS-Native-RU.apk.
          3. Установи CS16Client-Native-RU.apk.
          4. Установи CS16-Installer-Native-RU.apk и открой его.
          5. Разреши доступ ко всем файлам и нажми «Установить / восстановить игру».
          6. Дождись сообщения ГОТОВО и запускай Counter-Strike 1.6.

          Изменения v5:
          - нативное mainui внутри Xash вместо Android-имитации меню;
          - Steam-фон CS 1.6: BackgroundLayout + все 12 TGA-плиток;
          - исправлены пропавшие touch-кнопки: текстуры и пресеты теперь внутри APK;
          - главное меню использует штатные русские GameUI-токены;
          - русифицированы выбор команды/класса и основные меню покупки;
          - браузер серверов использует GoldSrc master 27011 + резервные мастеры;
          - главное меню: Новая игра / Поиск серверов / Настройки / Выйти;
          - Новая игра открывает нативное окно создания сервера;
          - Поиск серверов открывает нативный браузер mainui;
          - ui_language принудительно russian;
          - убирается xash.su master и добавляются GoldSrc master-серверы Valve;
          - Hazard Course скрыт, отсутствующий tr_1 отключён.
          EOF

          sha256sum CS16-Installer-Native-RU.apk CS16Client-Native-RU.apk Xash3D-FWGS-Native-RU.apk > SHA256SUMS.txt
          zip -9 CS16-Android-Native-RU-v5.zip \
            CS16-Installer-Native-RU.apk \
            CS16Client-Native-RU.apk \
            Xash3D-FWGS-Native-RU.apk \
            УСТАНОВКА.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh *.apk CS16-Android-Native-RU-v5.zip

      - name: Upload corrected Android pack
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Android-Native-RU-v5
          path: |
            CS16-Android-Native-RU-v5.zip
            CS16-Installer-Native-RU.apk
            CS16Client-Native-RU.apk
            Xash3D-FWGS-Native-RU.apk
            УСТАНОВКА.txt
            SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
