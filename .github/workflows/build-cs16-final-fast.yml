name: Build CS16 Android Final RU Fast

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-cs16-final-fast.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache zip
          python3 -m pip install --disable-pip-version-check 'git+https://github.com/wkentaro/gdown.git@main'

      - name: Download game data in parallel
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import gdown

          sources = {
              'valve': '13ES7ete84kf1bqZEV36QUHUxWbpUPfyU',
              'cstrike': '1q0sK9tdBaXM2XiqOD1t7jdec3OuuSzE2',
          }
          all_files = []
          for name, folder_id in sources.items():
              out = os.path.join('game-data', name) + os.sep
              os.makedirs(out, exist_ok=True)
              print('Listing', name, flush=True)
              files = gdown.download_folder(
                  id=folder_id,
                  output=out,
                  quiet=True,
                  use_cookies=False,
                  skip_download=True,
              )
              if not files:
                  raise SystemExit(f'Не удалось получить список {name}')
              print(name, len(files), 'files listed', flush=True)
              all_files.extend(files)

          def download_one(item):
              os.makedirs(os.path.dirname(item.local_path), exist_ok=True)
              result = gdown.download(
                  id=item.id,
                  output=item.local_path,
                  quiet=True,
                  use_cookies=False,
                  resume=True,
                  retries=5,
              )
              if not result or not os.path.isfile(item.local_path):
                  raise RuntimeError(item.local_path)
              return item.local_path, os.path.getsize(item.local_path)

          done = 0
          total_bytes = 0
          failures = []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = {pool.submit(download_one, f): f for f in all_files}
              for fut in as_completed(futures):
                  item = futures[fut]
                  try:
                      path, size = fut.result()
                      done += 1
                      total_bytes += size
                      if done % 50 == 0 or done == len(all_files):
                          print(f'Downloaded {done}/{len(all_files)} files, {total_bytes/1024/1024:.1f} MiB', flush=True)
                  except Exception as e:
                      failures.append((item.id, item.local_path, repr(e)))
          if failures:
              print('Failures:', failures[:30], flush=True)
              raise SystemExit(f'{len(failures)} files failed')
          PY

      - name: Verify complete game data
        shell: bash
        run: |
          test -f game-data/cstrike/liblist.gam
          test -d game-data/cstrike/maps
          test -d game-data/cstrike/models
          test -d game-data/cstrike/sprites
          test -f game-data/cstrike/sprites/hud.txt
          grep -q 'number_0' game-data/cstrike/sprites/hud.txt
          test -f game-data/cstrike/resource/gameui_russian.txt
          test -f game-data/cstrike/resource/serverbrowser_russian.txt
          test -f game-data/valve/resource/valve_russian.txt
          echo "Valve files: $(find game-data/valve -type f | wc -l)"
          echo "CStrike files: $(find game-data/cstrike -type f | wc -l)"
          du -sh game-data/valve game-data/cstrike

      - name: Embed game data in launcher
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          cd game-data
          zip -r -1 ../app/src/main/assets/CS16-GameData.zip valve cstrike
          cd ..
          test -s app/src/main/assets/CS16-GameData.zip
          ls -lh app/src/main/assets/CS16-GameData.zip
          sha256sum app/src/main/assets/CS16-GameData.zip

      - name: Build final Russian launcher
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CS16-Final-RU.apk
          test -s CS16-Final-RU.apk

      - name: Clone and patch CS16Client
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Velaron/cs16-client.git cs16
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cs16/android/app/build.gradle')
          s = p.read_text()
          s = s.replace('applicationId = "su.xash.cs16client"', 'applicationId = "com.kotyara.cs16client"')
          p.write_text(s)
          PY
          cat > cs16/android/app/src/main/java/su/xash/cs16client/MainActivity.java <<'JAVA'
          package su.xash.cs16client;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  String engine = "su.xash.engine.test";
                  try {
                      getPackageManager().getPackageInfo(engine, 0);
                  } catch (PackageManager.NameNotFoundException e) {
                      engine = "su.xash.engine";
                      try {
                          getPackageManager().getPackageInfo(engine, 0);
                      } catch (PackageManager.NameNotFoundException ex) {
                          startActivity(new Intent(Intent.ACTION_VIEW,
                                  Uri.parse("https://github.com/FWGS/xash3d-fwgs/releases/tag/continuous")));
                          finish();
                          return;
                      }
                  }

                  String argv = "-language russian -dll @yapb +cl_advertise_engine_in_name 0 +cl_ticket_generator revemu2013";
                  String server = getIntent().getStringExtra("server");
                  if (server != null && server.matches("^[A-Za-z0-9._-]+:[0-9]{1,5}$")) {
                      argv += " +connect " + server + " gs";
                  }

                  Intent game = new Intent().setComponent(
                          new ComponentName(engine, "su.xash.engine.XashActivity"))
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK)
                          .putExtra("gamedir", "cstrike")
                          .putExtra("gamelibdir", getApplicationInfo().nativeLibraryDir)
                          .putExtra("argv", argv)
                          .putExtra("package", getPackageName());
                  startActivity(game);
                  finish();
              }
          }
          JAVA

      - name: Build patched CS16Client
        working-directory: cs16/android
        run: |
          chmod +x gradlew
          ./gradlew assembleGitDebug --stacktrace
          cp app/build/outputs/apk/git/debug/app-git-debug.apk "$GITHUB_WORKSPACE/CS16Client-Final-RU.apk"
          test -s "$GITHUB_WORKSPACE/CS16Client-Final-RU.apk"

      - name: Download latest official Xash3D FWGS
        run: |
          curl -L --fail --retry 3 -o Xash3D-FWGS-latest.apk \
            https://github.com/FWGS/xash3d-fwgs/releases/download/continuous/xash3d-fwgs-android.apk
          test "$(stat -c%s Xash3D-FWGS-latest.apk)" -gt 40000000

      - name: Validate APK contents
        shell: bash
        run: |
          unzip -l CS16-Final-RU.apk | grep -q 'assets/CS16-GameData.zip'
          unzip -l CS16Client-Final-RU.apk | grep -q 'lib/arm64-v8a/'
          unzip -l Xash3D-FWGS-latest.apk | grep -q 'lib/arm64-v8a/'
          echo 'APK validation passed'

      - name: Create final package and hashes
        shell: bash
        run: |
          cat > УСТАНОВКА.txt <<'EOF'
          COUNTER-STRIKE 1.6 ANDROID — ФИНАЛЬНАЯ РУССКАЯ СБОРКА

          Установка:
          1. Xash3D-FWGS-latest.apk
          2. CS16Client-Final-RU.apk
          3. CS16-Final-RU.apk

          Открой «Counter-Strike 1.6» и нажми «Установить / восстановить файлы игры».
          Разреши полный доступ к памяти и дождись завершения. valve и cstrike уже встроены в APK —
          Google Drive, ZIP и ручное копирование на телефоне не нужны.

          Возможности:
          - главное меню и лаунчер полностью на русском;
          - игровой клиент запускается с -language russian;
          - нет отладочных -dev/-log;
          - браузер запрашивает Valve master server с фильтром cstrike;
          - отображает имя, карту, игроков, пинг и IP:порт;
          - можно подключиться вручную по IP:порт;
          - запуск подключения идёт как GoldSrc protocol 48;
          - перед запуском проверяются hud.txt/number_0, карты, модели, спрайты и русская локализация.

          Ограничение: некоторые серверы с обязательной Steam-аутентификацией или анти-Xash защитой
          могут отклонять Xash3D-клиент. Это ограничение совместимости сервера/движка.
          EOF
          sha256sum CS16-Final-RU.apk CS16Client-Final-RU.apk Xash3D-FWGS-latest.apk > SHA256SUMS.txt
          zip -0 CS16-Android-Final-RU.zip CS16-Final-RU.apk CS16Client-Final-RU.apk Xash3D-FWGS-latest.apk УСТАНОВКА.txt SHA256SUMS.txt
          ls -lh CS16-Final-RU.apk CS16Client-Final-RU.apk Xash3D-FWGS-latest.apk CS16-Android-Final-RU.zip
          cat SHA256SUMS.txt

      - name: Upload final Android pack
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Android-Final-RU-Fast
          path: |
            CS16-Android-Final-RU.zip
            CS16-Final-RU.apk
            CS16Client-Final-RU.apk
            Xash3D-FWGS-latest.apk
            УСТАНОВКА.txt
            SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
